
# this file builds the hyprlock theme
# pywal fills in the colors
# change this one, not the live file

$background = rgb({background.strip})
$panel = rgba({background.strip}ee)
$panelSolid = rgba({background.strip}f8)
$foreground = rgb({foreground.strip})
$muted = rgb({color8.strip})
$accent = rgb({color4.strip})
$accentSoft = rgba({color4.strip}78)
$accentFaint = rgba({color4.strip}3d)
$label = rgb({color6.strip})
$danger = rgb(FF7A7A)
$warning = rgb(F4C76D)
$success = rgb(75D69A)
$font = PP Right Serif Mono Fine

general {{
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = false
    fractional_scaling = 2
    fail_timeout = 1800
}}

auth {{
    pam:enabled = true
    pam:module = hyprlock
}}

animations {{
    enabled = true
    bezier = elegant, 0.22, 1, 0.36, 1
    bezier = lockFade, 0.37, 0, 0.63, 1
    animation = fadeIn, 1, 8.0, lockFade
    animation = fadeOut, 1, 12.0, lockFade
    animation = inputField, 1, 2.8, elegant
}}

background {{
    monitor =
    path = {wallpaper}
    color = $background
    blur_passes = 3
    blur_size = 9
    noise = 0.006
    contrast = 0.92
    brightness = 0.50
    vibrancy = 0.08
    vibrancy_darkness = 0.04
}}

shape {{
    monitor =
    size = 900, 800
    color = rgba({background.strip}b8)
    rounding = 0
    border_size = 1
    border_color = $accentSoft
    shadow_passes = 4
    shadow_size = 12
    shadow_color = rgba(000000b0)
    shadow_boost = 1.3
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}}

shape {{
    monitor =
    size = 876, 776
    color = $panel
    rounding = 0
    border_size = 2
    border_color = $accent
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}}

shape {{
    monitor =
    size = 850, 750
    color = rgba({background.strip}00)
    rounding = 0
    border_size = 1
    border_color = $accentFaint
    position = 0, 0
    halign = center
    valign = center
    zindex = 2
}}

image {{
    monitor =
    path = __HOME__/.config/hypr/assets/imgborders-floral-lock-wide.png
    size = 800
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 3
}}

shape {{
    monitor =
    size = 152, 152
    color = $panelSolid
    rounding = 0
    border_size = 1
    border_color = $accentFaint
    position = 0, 220
    halign = center
    valign = center
    zindex = 4
}}

label {{
    monitor =
    text = S
    color = $muted
    font_size = 60
    font_family = $font
    position = 0, 220
    halign = center
    valign = center
    zindex = 5
}}

image {{
    monitor =
    path = __HOME__/.face
    size = 136
    rounding = 0
    border_size = 2
    border_color = $accent
    position = 0, 220
    halign = center
    valign = center
    zindex = 6
}}

label {{
    monitor =
    text = <span letter_spacing='2800'>welcome back</span>
    color = $label
    font_size = 11
    font_family = $font
    position = 0, 326
    halign = center
    valign = center
    zindex = 5
}}

label {{
    monitor =
    text = $TIME
    color = $foreground
    font_size = 84
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000080)
    position = 0, 68
    halign = center
    valign = center
    zindex = 5
}}

label {{
    monitor =
    text = cmd[update:60000] date "+%A, %d %B"
    color = $label
    font_size = 19
    font_family = $font
    position = 0, -8
    halign = center
    valign = center
    zindex = 5
}}

shape {{
    monitor =
    size = 156, 1
    color = $accentFaint
    rounding = 0
    position = -96, -49
    halign = center
    valign = center
    zindex = 5
}}

shape {{
    monitor =
    size = 7, 7
    color = $panelSolid
    rounding = 0
    rotate = 45
    border_size = 1
    border_color = $accentSoft
    position = 0, -49
    halign = center
    valign = center
    zindex = 5
}}

shape {{
    monitor =
    size = 156, 1
    color = $accentFaint
    rounding = 0
    position = 96, -49
    halign = center
    valign = center
    zindex = 5
}}

label {{
    monitor =
    text = <span letter_spacing='1000'>—  $USER  —</span>
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, -88
    halign = center
    valign = center
    zindex = 5
}}

input-field {{
    monitor =
    size = 500, 64
    outline_thickness = 2
    dots_size = 0.16
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = -1
    outer_color = $accent
    inner_color = $panelSolid
    font_color = $foreground
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span letter_spacing='700'><i>Enter password</i></span>
    hide_input = false
    rounding = 0
    check_color = $success
    check_text = <i>checking...</i>
    fail_color = $danger
    fail_text = <i>incorect...</i>
    capslock_color = $warning
    numlock_color = $warning
    position = 0, -174
    halign = center
    valign = center
    zindex = 5
}}

label {{
    monitor =
    text = <span letter_spacing='900'>enter to unlock</span>
    color = $muted
    font_size = 10
    font_family = $font
    position = 0, -246
    halign = center
    valign = center
    zindex = 5
}}
